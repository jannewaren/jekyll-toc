AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "*.gemspec"
    - "vendor/**/*"
    - Rakefile
    - Gemfile
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-performance

Metrics/MethodLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/ClassLength:
  Enabled: false

Naming/FileName:
  Enabled: false

Layout/LineLength:
  Enabled: false

Style/WordArray:
  Enabled: false
